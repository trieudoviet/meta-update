[[apps]]
id = "claude-code"
name = "Claude Code"
installed = { type = "command", argv = ["claude", "--version"], regex = '([0-9]+(?:\.[0-9]+)+)' }
latest = { type = "npm", package = "@anthropic-ai/claude-code" }
update = { type = "command", argv = ["claude", "update"] }

[[apps]]
id = "codex-cli"
name = "Codex CLI"
installed = { type = "command", argv = ["codex", "--version"], regex = '([0-9]+(?:\.[0-9]+)+)' }
latest = { type = "npm", package = "@openai/codex" }
update = { type = "command", argv = ["codex", "update"] }

[[apps]]
id = "uv"
name = "uv"
installed = { type = "command", argv = ["uv", "--version"], regex = '([0-9]+(?:\.[0-9]+)+)' }
latest = { type = "github", repo = "astral-sh/uv" }
update = { type = "command", argv = ["uv", "self", "update"] }

[[apps]]
id = "obsidian"
name = "Obsidian"
installed = { type = "appimage_asar", path = "~/Apps/Obsidian.AppImage", member = "resources/app.asar", version_regex = '(?s)"description":\s*"Obsidian".*?"version":\s*"([^"]+)"' }
latest = { type = "github", repo = "obsidianmd/obsidian-releases" }
update = { type = "manual", url = "https://obsidian.md/download" }
