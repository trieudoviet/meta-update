schema_version = 1
report_dir = "~/.local/share/update-checker"
request_timeout_seconds = 20
download_timeout_seconds = 180
command_timeout_seconds = 60
github_token_env = "GITHUB_TOKEN"

[discovery]
enabled = true
appimage_dirs = ["~/Apps", "~/Applications", "~/Desktop"]
ignore_local_bins = [
  "7zz",
  "check-all-updates",
  "check-all-updates-v2.20260727",
  "monthly-disk-audit",
  "nlm",
  "notebooklm-mcp",
  "python",
  "python3",
  "update-codex-switcher",
  "uvx",
  "websockets",
]
ignore_duplicate_packages = ["snapd"]
ignore_deb_packages = [
  "apport-gtk",
  "baobab",
  "cheese",
  "chrome-remote-desktop",
  "drawing",
  "eog",
  "evince",
  "evince-common",
  "file-roller",
  "gnome-calculator",
  "gnome-calendar",
  "gnome-characters",
  "gnome-clocks",
  "gnome-connections",
  "gnome-disk-utility",
  "gnome-font-viewer",
  "gnome-logs",
  "gnome-power-manager",
  "gnome-system-monitor",
  "gnome-text-editor",
  "gnome-tweaks",
  "gnome-weather",
  "imagemagick-6.q16",
  "info",
  "loupe",
  "nautilus",
  "network-manager-gnome",
  "seahorse",
  "simple-scan",
  "snap-store",
  "software-properties-gtk",
  "totem",
  "transmission-gtk",
  "update-manager",
  "vim-common",
  "xterm",
  "yelp",
]

[[apps]]
id = "google-chrome"
name = "Google Chrome"
installed = { type = "dpkg", package = "google-chrome-stable" }
latest = { type = "apt", package = "google-chrome-stable" }
update = { type = "apt", package = "google-chrome-stable" }

[[apps]]
id = "vscode"
name = "VS Code"
installed = { type = "dpkg", package = "code" }
latest = { type = "apt", package = "code" }
update = { type = "apt", package = "code" }

[[apps]]
id = "cursor"
name = "Cursor"
installed = { type = "dpkg", package = "cursor" }
latest = { type = "apt", package = "cursor" }
update = { type = "apt", package = "cursor" }

[[apps]]
id = "codex-desktop"
name = "Codex Desktop"
installed = { type = "dpkg", package = "codex-desktop" }
latest = { type = "apt", package = "codex-desktop" }
update = { type = "apt", package = "codex-desktop" }

[[apps]]
id = "codex-switcher"
name = "Codex Switcher"
installed = { type = "dpkg", package = "codex-switcher" }
latest = { type = "github", repo = "Lampese/codex-switcher" }
update = { type = "command", argv = ["update-codex-switcher"] }

[[apps]]
id = "zoom"
name = "Zoom Workplace"
installed = { type = "dpkg", package = "zoom" }
latest = { type = "apt", package = "zoom" }
update = { type = "apt", package = "zoom" }

[[apps]]
id = "rustdesk"
name = "RustDesk"
installed = { type = "dpkg", package = "rustdesk" }
latest = { type = "github", repo = "rustdesk/rustdesk" }
update = { type = "github_deb", repo = "rustdesk/rustdesk", package = "rustdesk", asset_regex = '^rustdesk-{version}-x86_64\.deb$', require_digest = true }

[[apps]]
id = "remmina"
name = "Remmina"
installed = { type = "dpkg", package = "remmina" }
latest = { type = "apt", package = "remmina" }
update = { type = "apt", package = "remmina" }

[[apps]]
id = "gimp"
name = "GIMP"
installed = { type = "dpkg", package = "gimp" }
latest = { type = "apt", package = "gimp" }
update = { type = "apt", package = "gimp" }

[[apps]]
id = "filezilla"
name = "FileZilla"
installed = { type = "dpkg", package = "filezilla" }
latest = { type = "apt", package = "filezilla" }
update = { type = "apt", package = "filezilla" }

[[apps]]
id = "flameshot"
name = "Flameshot"
installed = { type = "dpkg", package = "flameshot" }
latest = { type = "github", repo = "flameshot-org/flameshot" }
update = { type = "github_zip_deb", repo = "flameshot-org/flameshot", package = "flameshot", asset_regex = '^flameshot-v[0-9.]+\+git.*-artifact-ubuntu-{os_version}-amd64\.zip$', require_digest = true }

[[apps]]
id = "okular"
name = "Okular"
installed = { type = "dpkg", package = "okular" }
latest = { type = "apt", package = "okular" }
update = { type = "apt", package = "okular" }

